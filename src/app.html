<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#eef3f5" />
		<script nonce="%sveltekit.nonce%">
			// Thème choisi dans l'appli (Automatique, Clair, Sombre), appliqué avant le premier affichage.
			// data-theme garde la préférence, data-scheme le résultat ; ui.svelte.ts reprend la même logique.
			(function () {
				var root = document.documentElement;
				var media = matchMedia('(prefers-color-scheme: dark)');
				function apply() {
					var pref = 'auto';
					try {
						pref = localStorage.getItem('theme') || 'auto';
					} catch (e) {}
					var scheme = pref === 'auto' ? (media.matches ? 'dark' : 'light') : pref;
					root.dataset.theme = pref;
					root.dataset.scheme = scheme;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', scheme === 'dark' ? '#050b0e' : '#eef3f5');
				}
				try {
					var accent = localStorage.getItem('accent');
					if (accent) root.dataset.accent = accent;
					// Réglage « Ambiance animée » (Réglages › Affichage), lu avant l'affichage.
					if (localStorage.getItem('ambient') === 'off') root.dataset.ambient = 'off';
				} catch (e) {}
				apply();
				media.addEventListener('change', apply);
				// Voile de démarrage : pas sur les écrans servis d'emblée (connexion), et retiré au plus tard
				// après 4 s si l'appli ne démarrait pas (le retrait normal, en fondu, est dans le layout).
				if (/^\/(login|logout)/.test(location.pathname)) root.classList.add('no-boot');
				setTimeout(function () {
					var veil = document.getElementById('boot');
					if (veil) veil.remove();
				}, 4000);
			})();
		</script>
		<style>
			/* Voile de démarrage : même image que l'écran de lancement (eau lagon, halo en haut à gauche, poisson de la marque
			   à 36 % de la largeur, centré à 45 % de la hauteur, sans texte), pour que le passage de l'un à l'autre ne se voie pas.
			   Le dessin vient de scripts/make-splash.mjs ; le fondu de sortie est dans src/lib/motion/boot.ts. */
			#boot {
				position: fixed;
				inset: 0;
				z-index: 2147483000;
				background:
					radial-gradient(90% 90% at 26% 0%, rgb(255 255 255 / 0.4), rgb(255 255 255 / 0)),
					linear-gradient(180deg, #2ccad9, #0b7f93 55%, #06323f);
				pointer-events: none;
				transition: opacity 300ms ease;
			}
			/* Boîte de 64 unités du poisson : 36 % / 56,3 unités de large ; le point (31,65 ; 28,7) tombe à 50 % / 45 %. */
			#boot svg {
				position: absolute;
				left: 29.76%;
				top: calc(45% - 18.35vw);
				width: 40.92%;
				height: auto;
				aspect-ratio: 1;
			}
			#boot.leaving {
				opacity: 0;
			}
			html.no-boot #boot {
				display: none;
			}
			@media (prefers-reduced-motion: reduce) {
				#boot {
					display: none;
				}
			}
		</style>

		<meta name="mobile-web-app-capable" content="yes" />

	<body data-sveltekit-preload-data="hover">

				</g>

				<path d="M21 22C19.5 14.5 23.5 9.5 29 8 28.5 12.5 31.5 15 38 17.5z" fill="#ff6f61" stroke="#ff6f61" stroke-width="2" stroke-linejoin="round" />
				<path d="M50 33C50 23.5 41.5 16.5 31.5 16.5 23 16.5 18 22 15.5 30.5v5C18 44 23 49.5 31.5 49.5 41.5 49.5 50 42.5 50 33z" fill="url(#boot-f)" />
				<path d="M37.5 22.5C34 29 34 37 37.5 43.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.6" stroke-linecap="round" />
				<circle cx="42.5" cy="28.5" r="3.2" fill="#06323f" />

				<circle cx="48" cy="10" r="2.1" fill="#fff" fill-opacity=".92" />
			</svg>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
