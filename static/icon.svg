<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2ccad9" />
			<stop offset=".56" stop-color="#0b7f93" />
			<stop offset="1" stop-color="#06323f" />
		</linearGradient>
		<radialGradient id="glow" cx=".26" cy=".02" r=".95">
			<stop offset="0" stop-color="#fff" stop-opacity=".46" />
			<stop offset="1" stop-color="#fff" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="coral" gradientUnits="userSpaceOnUse" x1="8" y1="12" x2="48" y2="54">
			<stop offset="0" stop-color="#ffc178" />
			<stop offset="1" stop-color="#ff6f61" />
		</linearGradient>
	</defs>
	<!-- plein cadre : iOS arrondit lui-même les coins, Android masque en cercle -->
	<rect width="1024" height="1024" fill="url(#water)" />
	<rect width="1024" height="1024" fill="url(#glow)" />
	<!-- deux rayons, d'en haut à gauche -->
	<g fill="#fff" opacity=".09">
		<path d="M150 0h120L110 1024H-30z" />
		<path d="M420 0h66L330 1024h-96z" />
	</g>
	<!-- le poisson de la marque, dans le cercle de sécurité (rayon 410) -->
	<g transform="translate(512 520) scale(11.500) translate(-31.650 -28.700)">
		<!-- ombre portée -->
		<g fill="#021b23" opacity=".28" transform="translate(.6 1.8)">
			<path d="M18 33C14.500 28.500 10.500 23 5 19.500 6.500 25.500 7 29.500 9.500 33 7 36.500 6.500 40.500 5 46.500 10.500 43 14.500 37.500 18 33z" stroke="#021b23" stroke-width="3" stroke-linejoin="round" />
			<path d="M50 33C50 23.500 41.500 16.500 31.500 16.500 23 16.500 18 22 15.500 30.500v5C18 44 23 49.500 31.500 49.500 41.500 49.500 50 42.500 50 33z" />
		</g>
		<path d="M18 33C14.500 28.500 10.500 23 5 19.500 6.500 25.500 7 29.500 9.500 33 7 36.500 6.500 40.500 5 46.500 10.500 43 14.500 37.500 18 33z" fill="url(#coral)" stroke="url(#coral)" stroke-width="3" stroke-linejoin="round" />
		<path d="M21 22C19.500 14.500 23.500 9.500 29 8 28.500 12.500 31.500 15 38 17.500z" fill="#ff6f61" stroke="#ff6f61" stroke-width="2" stroke-linejoin="round" />
		<path d="M50 33C50 23.500 41.500 16.500 31.500 16.500 23 16.500 18 22 15.500 30.500v5C18 44 23 49.500 31.500 49.500 41.500 49.500 50 42.500 50 33z" fill="url(#coral)" />
		<path d="M37.500 22.500C34 29 34 37 37.500 43.500" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.600" stroke-linecap="round" />
		<circle cx="42.500" cy="28.500" r="3.200" fill="#06323f" />
		<circle cx="43.500" cy="27.400" r="1.050" fill="#fff" />
		<circle cx="54.500" cy="18.500" r="4.300" fill="none" stroke="#fff" stroke-width="2" />
		<circle cx="48" cy="10" r="2.100" fill="#fff" fill-opacity=".92" />
	</g>
</svg>
